name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run verification gate
        run: make check

      - name: Install app build dependencies
        run: brew install imagemagick

      - name: Build macOS app
        run: scripts/build-mac-app.sh

      - name: Verify macOS app bundle
        run: scripts/verify-macos-app.sh

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y file libudev-dev pkg-config shellcheck

      - name: Run verification gate
        run: make check

      - name: Build Linux app
        run: scripts/build-linux-app.sh

      - name: Verify Linux app bundle
        run: scripts/verify-linux-app.sh
