name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run verification gate
        run: make check

      - name: Install app build dependencies
        run: brew install imagemagick

      - name: Build macOS app
        run: scripts/build-mac-app.sh

      - name: Verify macOS app bundle
        run: scripts/verify-macos-app.sh
