name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(awk -F'"' '/^__version__ = / { print $2; exit }' \
            cable_labelmaker/__init__.py)"
          expected_tag="v${package_version}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          tagged_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Release tag $GITHUB_REF_NAME is not on origin/main" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run source checks
        run: make check

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS
            archive_arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            archive_arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            archive_arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install macOS build dependency
        if: runner.os == 'macOS'
        run: brew install imagemagick

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y file libudev-dev pkg-config shellcheck

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: scripts/build-mac-app.sh

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "dist/Cable Labelmaker.app"
          "dist/Cable-Labelmaker-${GITHUB_REF_NAME}-macOS-arm64.zip"

      - name: Build Linux application
        if: runner.os == 'Linux'
        run: scripts/build-linux-app.sh

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release_name="Cable-Labelmaker-${GITHUB_REF_NAME}-linux-${{ matrix.archive_arch }}"
          release_root="dist/$release_name"
          mkdir -p "$release_root/scripts"
          cp -a dist/cablelabel "$release_root/"
          cp scripts/install-linux-service.sh "$release_root/scripts/"
          cp -a linux "$release_root/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$release_root/"
          tar -C dist -czf "dist/${release_name}.tar.gz" "$release_name"

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cablelabel-${{ matrix.platform }}-${{ matrix.archive_arch }}
          path: |
            dist/Cable-Labelmaker-*.zip
            dist/Cable-Labelmaker-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --generate-notes
          --verify-tag
