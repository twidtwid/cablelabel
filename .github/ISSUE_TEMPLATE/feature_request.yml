name: Feature request
description: Suggest an improvement to Cable Labelmaker.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cable-labeling task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the result you would like.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Printer and tape
      placeholder: Brother PT-D600 with 24 mm laminated tape
